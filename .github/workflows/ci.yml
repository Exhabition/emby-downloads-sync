name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.1xx
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore
        run: dotnet restore EmbyDownloadsSync.sln --locked-mode
      - name: Verify formatting
        run: dotnet format EmbyDownloadsSync.sln --no-restore --verify-no-changes
      - name: Build
        run: dotnet build EmbyDownloadsSync.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test EmbyDownloadsSync.sln --configuration Release --no-build --no-restore
      - name: Smoke-test isolated plugin loading
        run: ./scripts/smoke-deploy.sh
      - name: Test plugin startup in Emby 4.9.5.0
        run: ./scripts/emby-local.sh test
      - name: Stop Emby integration server
        if: always()
        run: ./scripts/emby-local.sh down
      - name: Smoke-test packaging
        run: ./scripts/package.sh 0.0.0-ci
      - uses: actions/upload-artifact@v7
        with:
          name: emby-downloads-sync-ci-package
          path: dist/*
          if-no-files-found: error
